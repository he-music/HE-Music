<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/icon" href="/icons/favicon.ico" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>HE-Music</title>
    <script id="startup-window-role">
      if (window.mygo && location.hash.slice(1).split(/[?#]/, 1)[0] === "/desktop-lyric") {
        document.documentElement.classList.add("desktop-lyrics-window");
      }
    </script>
    <style id="startup-loading-style">
      #startup-loading {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 40px;
        background: #fff;
        color: #f55e55;
        user-select: none;
        --app-region: drag;
      }

      #startup-loading img {
        display: block;
        width: 120px;
        height: 120px;
      }

      #startup-loading .startup-dots {
        display: flex;
        gap: 12px;
      }

      #startup-loading .startup-dots span {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: currentColor;
        animation: startup-pulse 1.8s infinite ease-in-out;
      }

      #startup-loading .startup-dots span:nth-child(2) {
        animation-delay: 0.16s;
      }

      #startup-loading .startup-dots span:nth-child(3) {
        animation-delay: 0.32s;
      }

      .desktop-lyrics-window #startup-loading {
        display: none;
      }

      @keyframes startup-pulse {
        0%,
        80%,
        100% {
          opacity: 0.3;
          transform: scale(0.4);
        }

        40% {
          opacity: 1;
          transform: scale(1);
        }
      }

      @media (prefers-color-scheme: dark) {
        #startup-loading {
          background: #161616;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #startup-loading .startup-dots span {
          animation: none;
        }
      }
    </style>
    <!-- 关键资源预加载 -->
    <link rel="preload" href="/fonts/logo.woff2" as="font" type="font/woff2" crossorigin />
    <!-- font（非阻塞加载） -->
    <link rel="stylesheet" href="/fonts/font.css" media="print" onload="this.media = 'all'" />
  </head>

  <body>
    <div id="app"></div>
    <div id="startup-loading" role="progressbar" aria-label="HE-Music" aria-busy="true">
      <img src="/icons/logo.svg" alt="" width="120" height="120" fetchpriority="high" />
      <div class="startup-dots" aria-hidden="true"><span></span><span></span><span></span></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
