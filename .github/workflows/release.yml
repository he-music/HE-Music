name: Build & Release

on:
  push:
    tags: ["v*", "mygo-test-v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  VITE_API_URL: ${{ secrets.VITE_API_URL }}
  VITE_NETEASE_API_URL: ${{ secrets.VITE_NETEASE_API_URL }}
  CGO_ENABLED: "0"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:runtime
      - run: pnpm vendor:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:desktop:vendor && pnpm test:desktop:release
      - run: go test ./...
      - run: pnpm build:web
      - uses: actions/upload-artifact@v4
        with:
          name: HE-Music-web
          path: dist/web/
          if-no-files-found: error

  desktop:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: darwin/universal
            id: macos-universal
          - os: windows-latest
            target: windows/amd64,windows/arm64
            id: windows
          - os: ubuntu-latest
            target: linux/amd64,linux/arm64
            id: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:runtime
      - run: pnpm vendor:check
      - name: Build test artifacts
        if: ${{ github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/') }}
        run: node scripts/vendor/mygo.mjs build -platform ${{ matrix.target }} -sign - -skip-dmg -skip-notarize
      - name: Build and verify signed update artifacts
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: node scripts/package/mygo-release.mjs --build --platform ${{ matrix.target }}
      - name: Check Windows SDK window messages
        if: runner.os == 'Windows'
        run: pnpm test:desktop:windows-sdk
      - name: Archive test artifacts with file permissions
        if: ${{ github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        run: |
          mkdir -p build/artifacts
          tar -czf build/artifacts/HE-Music-${{ matrix.id }}-test.tar.gz -C build/mygo .
      - uses: actions/upload-artifact@v4
        with:
          name: HE-Music-${{ matrix.id }}
          path: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && 'build/mygo/' || 'build/artifacts/' }}
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: HE-Music-*
          path: release-artifacts
      - name: Merge artifact checksums
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root = Path("release-artifacts")
          rows = {}
          for file in root.rglob("*"):
              if not file.is_file():
                  continue
              if not (file.name.endswith((".tar.gz", ".dmg", ".deb", ".delta")) or
                      file.suffix == ".exe" and "-setup-" in file.name):
                  continue
              if file.name in rows:
                  raise SystemExit("Duplicate release artifact name: " + file.name)
              with file.open("rb") as stream:
                  rows[file.name] = hashlib.file_digest(stream, "sha256").hexdigest()
          if not rows:
              raise SystemExit("Missing release archives")
          (root / "SHA256SUMS").write_text("".join(
              f"{rows[name]}  {name}\n" for name in sorted(rows)), encoding="utf-8")
          PY
      # A tag build must pass the configured feed/key/signature checks first.
      # Keep the release as a draft for the platform installation review.
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          prerelease: false
          # 草稿不设 latest；v* 正式版公开时选择 latest，测试频道保持非 latest。
          make_latest: false
          files: |
            release-artifacts/**/*.tar.gz
            release-artifacts/**/*.dmg
            release-artifacts/**/*-setup-*.exe
            release-artifacts/**/*.deb
            release-artifacts/**/*.delta
            release-artifacts/**/update-*.json
            release-artifacts/SHA256SUMS
            release-artifacts/HE-Music-linux/linux-amd64/install.sh
            release-artifacts/HE-Music-windows/windows-amd64/install.ps1
