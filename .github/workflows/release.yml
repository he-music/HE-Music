name: Build & Release

on:
  push:
    tags: ["v*", "mygo-test-v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  VITE_API_URL: ${{ secrets.VITE_API_URL }}
  VITE_NETEASE_API_URL: ${{ secrets.VITE_NETEASE_API_URL }}
  CGO_ENABLED: "0"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:runtime
      - run: pnpm vendor:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:desktop:vendor && pnpm test:desktop:release && pnpm test:desktop:mpv
      - run: go test ./...
      - run: pnpm build:web
      - uses: actions/upload-artifact@v4
        with:
          name: HE-Music-web
          path: dist/web/
          if-no-files-found: error

  mpv-resources:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: darwin/universal
            id: macos-universal
          - os: windows-2025
            target: windows/amd64
            id: windows-amd64
          - os: windows-11-arm
            target: windows/arm64
            id: windows-arm64
          - os: ubuntu-24.04
            target: linux/amd64
            id: linux-amd64
          - os: ubuntu-24.04-arm
            target: linux/arm64
            id: linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-go@v6
        if: runner.os == 'Windows'
        with:
          go-version-file: go.mod
      - uses: actions/cache@v4
        with:
          path: build/mpv-bundles/
          key: mpv-bundles-${{ matrix.id }}-${{ hashFiles('scripts/mpv/bundles.lock.json') }}
      - name: Download and verify pinned libmpv bundle
        run: python scripts/mpv/download.py --target ${{ matrix.target }}
      - name: Verify staged resources offline
        run: python scripts/mpv/download.py --check --offline --target ${{ matrix.target }}
      - name: Install Windows audio fixture generator
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          ffmpeg -version
      - name: Exercise Windows production gateway
        if: runner.os == 'Windows'
        shell: bash
        run: |
          export MPV_INTEGRATION_LIBRARY="$(cygpath -m "$PWD/resources/${{ matrix.id }}/mpv/libmpv-2.dll")"
          go test ./desktop -run 'TestMpvBundled' -count=1 -v
      - name: Archive resources with permissions
        shell: bash
        run: |
          mkdir -p build
          shopt -s nullglob
          resource_paths=(resources/*/mpv resources/*/licenses/mpv)
          tar -czf build/mpv-resources-${{ matrix.id }}.tar.gz "${resource_paths[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: mpv-resources-${{ matrix.id }}
          path: build/mpv-resources-${{ matrix.id }}.tar.gz
          if-no-files-found: error

  desktop:
    needs: [validate, mpv-resources]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: darwin/universal
            id: macos-universal
            resources: mpv-resources-macos-universal
          - os: windows-latest
            target: windows/amd64,windows/arm64
            id: windows
            resources: mpv-resources-windows-*
          - os: ubuntu-24.04
            target: linux/amd64,linux/arm64
            id: linux
            resources: mpv-resources-linux-*
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ matrix.resources }}
          path: build/mpv-incoming
          merge-multiple: true
      - name: Restore verified libmpv resources
        shell: bash
        run: |
          for archive in build/mpv-incoming/*.tar.gz; do
            tar -xzf "$archive" -C .
          done
          python scripts/mpv/download.py --check --offline --target ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:runtime
      - run: pnpm vendor:check
      - name: Build test artifacts
        if: ${{ github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/') }}
        run: node scripts/vendor/mygo.mjs build -platform ${{ matrix.target }} -sign - -skip-dmg -skip-notarize
      - name: Build and verify signed update artifacts
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: node scripts/package/mygo-release.mjs --build --platform ${{ matrix.target }}
      - name: Audit final Linux ELF requirements
        if: runner.os == 'Linux'
        run: python scripts/mpv/audit_linux.py --target ${{ matrix.target }} --output build/mygo/libmpv-linux-abi.json
      - name: Check Windows SDK window messages
        if: runner.os == 'Windows'
        run: pnpm test:desktop:windows-sdk
      - name: Archive test artifacts with file permissions
        if: ${{ github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        run: |
          mkdir -p build/artifacts
          tar -czf build/artifacts/HE-Music-${{ matrix.id }}-test.tar.gz -C build/mygo .
      - uses: actions/upload-artifact@v4
        with:
          name: HE-Music-${{ matrix.id }}
          path: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && 'build/mygo/' || 'build/artifacts/' }}
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Prepare release notes from changelog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          tag = os.environ["RELEASE_TAG"]
          version = tag.removeprefix("mygo-test-v").removeprefix("v")
          lines = Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          heading = "## " + version
          if heading not in lines:
              raise SystemExit("Missing changelog section: " + version)
          start = lines.index(heading) + 1
          end = next((i for i in range(start, len(lines)) if lines[i].startswith("## ")), len(lines))
          notes = "\n".join(lines[start:end]).strip()
          if not notes:
              raise SystemExit("Empty release notes: " + version)
          (Path(os.environ["RUNNER_TEMP"]) / "release-notes.md").write_text(notes + "\n", encoding="utf-8")
          PY
      - uses: actions/download-artifact@v4
        with:
          pattern: HE-Music-*
          path: release-artifacts
      - name: Merge artifact checksums
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root = Path("release-artifacts")
          rows = {}
          for file in root.rglob("*"):
              if not file.is_file():
                  continue
              if not (file.name.endswith((".tar.gz", ".dmg", ".deb", ".delta")) or
                      file.suffix == ".exe" and "-setup-" in file.name):
                  continue
              if file.name in rows:
                  raise SystemExit("Duplicate release artifact name: " + file.name)
              with file.open("rb") as stream:
                  rows[file.name] = hashlib.file_digest(stream, "sha256").hexdigest()
          if not rows:
              raise SystemExit("Missing release archives")
          (root / "SHA256SUMS").write_text("".join(
              f"{rows[name]}  {name}\n" for name in sorted(rows)), encoding="utf-8")
          PY
      # Publish stable tags after all platform builds and signature checks pass.
      # Test-channel tags remain drafts and never replace the stable latest release.
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/release-notes.md
          draft: ${{ startsWith(github.ref, 'refs/tags/mygo-test-v') }}
          generate_release_notes: false
          prerelease: false
          make_latest: ${{ startsWith(github.ref, 'refs/tags/v') && 'true' || 'false' }}
          files: |
            release-artifacts/**/*.tar.gz
            release-artifacts/**/*.dmg
            release-artifacts/**/*-setup-*.exe
            release-artifacts/**/*.deb
            release-artifacts/**/*.delta
            release-artifacts/**/update-*.json
            release-artifacts/SHA256SUMS
            release-artifacts/HE-Music-linux/linux-amd64/install.sh
            release-artifacts/HE-Music-windows/windows-amd64/install.ps1
